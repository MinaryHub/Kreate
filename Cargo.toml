[workspace]
resolver = "2"
members = [
    "crates/kreate-math",
    "crates/kreate-mesh",
    "crates/kreate-scene",
    "crates/kreate-ops",
    "crates/kreate-ops-derive",
    "crates/kreate-input",
    "crates/kreate-render",
    "crates/kreate-shader",
    "crates/kreate-io",
    "crates/kreate-ui",
    "crates/kreate-testkit",
    "crates/kreate-i18n",
    "crates/kreate-reflect",
    "apps/kreate",
    "apps/kreatec",
    "apps/kreate-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kreate3d/kreate"

# Versions are PINNED. The winit <-> egui <-> egui-wgpu <-> wgpu <-> naga_oil cluster is
# tightly coupled; upgrade the whole cluster in one dedicated PR, verified by the
# renderer smoke test (headless render + image hash).
[workspace.dependencies]
kreate-math       = { path = "crates/kreate-math" }
kreate-mesh       = { path = "crates/kreate-mesh" }
kreate-scene      = { path = "crates/kreate-scene" }
kreate-ops        = { path = "crates/kreate-ops" }
kreate-ops-derive = { path = "crates/kreate-ops-derive" }
kreate-input      = { path = "crates/kreate-input" }
kreate-render     = { path = "crates/kreate-render" }
kreate-shader     = { path = "crates/kreate-shader" }
kreate-io         = { path = "crates/kreate-io" }
kreate-ui         = { path = "crates/kreate-ui" }
kreate-testkit    = { path = "crates/kreate-testkit" }
kreate-i18n       = { path = "crates/kreate-i18n" }
kreate-reflect    = { path = "crates/kreate-reflect" }

# --- graphics cluster (pinned exactly) ---
wgpu       = "=29.0.4"
winit      = "=0.30.13"
egui       = "=0.35.0"
# Reading the bundled font's glyph coverage. Already in the tree as egui's
# own rasteriser, so this costs no build time.
ab_glyph   = "0.2"
egui-wgpu  = "=0.35.0"
egui-winit = "=0.35.0"

# --- math ---
glam     = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "=1.25.0", features = ["derive"] }

# --- concurrency ---
rayon             = "1.10"
crossbeam-channel = "0.5"
parking_lot       = "0.12"
arc-swap          = "1.7"

# --- data structures ---
slotmap  = "1.0"
# glTF import. Mature and complete: glb, external buffers, sparse accessors —
# the parts that are tedious and easy to get subtly wrong. The *semantics* still
# live in this project's IR, which is where they belong.
#
# `import` is what resolves buffers — glb binary chunks and base64 data URIs —
# and it is the whole reason to take the dependency. It pulls in `image` with
# only png and jpeg, which are the two formats glTF actually embeds and which a
# texture pipeline will want regardless.
gltf = { version = "1", default-features = false, features = ["import", "utils", "names", "extensions", "KHR_lights_punctual"] }

# The document container. `zip` because the format is a zip: universal tooling,
# streaming, random access to one mesh, and recoverable with `unzip` at 2am.
zip = { version = "6", default-features = false, features = ["deflate"] }
# Native file dialogs. The alternative is drawing one inside egui, which means
# reimplementing a file browser — and getting a worse one that does not know
# about the user's shortcuts, network locations, or shell extensions. `rfd` calls
# the platform's own dialog on all three targets.
#
# `xdg-portal` rather than gtk3 on Linux: it talks to the desktop portal over
# D-Bus, so there is no GTK build dependency and it works from inside a flatpak.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Tier two crash reporting: a GPU fault, a stack overflow or an abort does not
# run a Rust panic hook at all, so the only way to record one is to have a
# *separate process* write the dump. That process is this same executable
# re-invoked with a flag, so there is no second binary to ship or keep in step.
#
# `crash-handler` installs the platform handler (a vectored exception handler on
# Windows, signal handlers elsewhere); `minidumper` is the client/server pair
# that carries the request across. Both are Embark's, both are what everything
# else in this space uses.
crash-handler = "0.8"
minidumper = "0.11"

serde = { version = "1", features = ["derive"] }
# `preserve_order` deliberately left off: without it the map is a BTreeMap, so
# JSON keys come out sorted and the file is byte-identical between saves.
#
# `float_roundtrip` deliberately on. Without it serde_json parses floats through
# a fast path that is not exactly round-trip correct, and a document saved and
# reloaded came back with every rotation off by one unit in the last place —
# which then accumulates over repeated saves. Found by a load-and-save test that
# demanded the file reproduce itself byte for byte.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Vertex-cache optimisation and meshlet clustering. Builds through `cc`, not
# cmake — which is why it is usable here at all, since cmake is not installed.
meshopt = "0.6.2"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
arrayvec = "0.7"
indexmap = "2.5"
# default-features off drops `runtime-rng` (and with it `getrandom`). Two reasons,
# and the first is the important one: a runtime-random hash seed makes iteration
# order vary between runs, which violates the workspace-wide rule that operator
# output must never depend on hash order. Fixed keys also let the mesh kernel
# compile to wasm32-unknown-unknown, which CI checks.
ahash    = { version = "0.8", default-features = false, features = ["std"] }

# --- errors / logging ---
thiserror = "2.0"
anyhow    = "1.0"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

pollster  = "0.4"

# --- dev / test ---
proptest = "1.5"
criterion = "0.5"

# Debug-mode mesh math is ~50x too slow to be usable. Optimize dependencies fully and
# our own code lightly; this keeps debug builds interactive without wrecking step-debugging.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1          # keep line tables for profiling (tracy/puffin) and crash minidumps
