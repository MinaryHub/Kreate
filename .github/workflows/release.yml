name: Build binaries

# Release builds of the application for every platform, as downloadable
# artifacts. macOS has to be built on a Mac — the Apple SDK and linker are not
# something another platform can supply — so this is where a macOS build comes
# from. Run it by hand from the Actions tab, or push a tag starting with `v`.
#
# A tag is a release: the tag has to match the version in Cargo.toml, and once
# every platform is built they are published as a GitHub release with that
# version's section of CHANGELOG.md as its notes. See RELEASING.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match Cargo.toml's version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: [verify]
    # By hand there is no tag to verify, and the build still runs.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: kreate
            mcp: kreate-mcp
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: kreate
            mcp: kreate-mcp
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: kreate
            mcp: kreate-mcp
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: kreate.exe
            mcp: kreate-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libudev-dev libdbus-1-dev patchelf

      - name: Build
        run: cargo build --release -p kreate -p kreate-mcp --target ${{ matrix.target }}

      # Open Image Denoise beside the program, which loads it at run time to
      # denoise finished renders (`kreate_render::oidn`); without it a render
      # is filtered by the view's own denoiser. The CPU device only — the
      # GPU ones are most of the download and need their vendors' runtimes —
      # and Threading Building Blocks, which it runs on. Both Apache-2.0;
      # their licences go in with them. A missing file is a warning, not a
      # failed release: the program runs without it.
      - name: Open Image Denoise
        shell: bash
        env:
          OIDN: 2.3.3
        run: |
          mkdir -p dist oidn
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              archive="oidn-$OIDN.x86_64.linux.tar.gz"; dir="oidn-$OIDN.x86_64.linux/lib"
              files="libOpenImageDenoise.so.2 libOpenImageDenoise_core.so.$OIDN libOpenImageDenoise_device_cpu.so.$OIDN libtbb.so.12" ;;
            aarch64-apple-darwin)
              archive="oidn-$OIDN.arm64.macos.tar.gz"; dir="oidn-$OIDN.arm64.macos/lib"
              files="libOpenImageDenoise.2.dylib libOpenImageDenoise_core.$OIDN.dylib libOpenImageDenoise_device_cpu.$OIDN.dylib libtbb.12.dylib" ;;
            x86_64-apple-darwin)
              archive="oidn-$OIDN.x86_64.macos.tar.gz"; dir="oidn-$OIDN.x86_64.macos/lib"
              files="libOpenImageDenoise.2.dylib libOpenImageDenoise_core.$OIDN.dylib libOpenImageDenoise_device_cpu.$OIDN.dylib libtbb.12.dylib" ;;
            x86_64-pc-windows-msvc)
              archive="oidn-$OIDN.x64.windows.zip"; dir="oidn-$OIDN.x64.windows/bin"
              files="OpenImageDenoise.dll OpenImageDenoise_core.dll OpenImageDenoise_device_cpu.dll tbb12.dll" ;;
          esac
          url="https://github.com/RenderKit/oidn/releases/download/v$OIDN/$archive"
          if ! curl -fsSL -o "oidn/$archive" "$url"; then
            echo "::warning::could not download $url; released without Open Image Denoise"
            exit 0
          fi
          cd oidn
          case "$archive" in
            *.zip) unzip -q "$archive" ;;
            *) tar xzf "$archive" ;;
          esac
          for f in $files; do
            # Dereferenced: the zip the updater fetches keeps no symlinks.
            if [ -e "$dir/$f" ]; then cp -L "$dir/$f" ../dist/; else echo "::warning::no $f in $archive"; fi
          done
          # Its libraries look for each other in `../lib`, their archive's
          # layout; here they sit beside the program, so they are pointed at
          # their own folder. (The loader also loads them ahead by full path.)
          for f in $files; do
            [ -e "../dist/$f" ] || continue
            case "$RUNNER_OS" in
              Linux) patchelf --set-rpath '$ORIGIN' "../dist/$f" || echo "::warning::patchelf $f" ;;
              macOS)
                install_name_tool -add_rpath @loader_path "../dist/$f" 2>/dev/null || true
                codesign --force --sign - "../dist/$f" || echo "::warning::codesign $f" ;;
            esac
          done
          top="${dir%/*}"
          [ -f "$top/LICENSE.txt" ] && cp "$top/LICENSE.txt" ../dist/OpenImageDenoise-LICENSE.txt
          [ -f "$top/third-party-programs.txt" ] && cp "$top/third-party-programs.txt" ../dist/OpenImageDenoise-third-party.txt
          true

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/
          cp target/${{ matrix.target }}/release/${{ matrix.mcp }} dist/
          # Windows: DirectX's shader compiler beside the program, from the
          # runner's newest Windows SDK. wgpu uses it when it is there; the
          # old compiler it falls back on takes most of a minute over the
          # renderer's shaders on the first frame.
          if [ "$RUNNER_OS" = "Windows" ]; then
            sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 2>/dev/null | sort -V | tail -1)
            if [ -f "$sdk/dxcompiler.dll" ] && [ -f "$sdk/dxil.dll" ]; then
              cp "$sdk/dxcompiler.dll" "$sdk/dxil.dll" dist/
            else
              echo "::warning::no dxcompiler.dll in the Windows SDK"
            fi
          fi
          cd dist && tar czf ../kreate-${{ matrix.name }}.tar.gz *
          # The zip is what the application's updater fetches (`update::asset_name`):
          # the executables at its top level.
          for py in python3 python; do
            if "$py" -c "" 2>/dev/null; then "$py" -m zipfile -c ../kreate-${{ matrix.name }}.zip *; break; fi
          done
          test -f ../kreate-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kreate-${{ matrix.name }}
          path: |
            kreate-${{ matrix.name }}.tar.gz
            kreate-${{ matrix.name }}.zip

  # The Android APK, built as the Android workflow builds it, for the same
  # release.
  android:
    name: Android APK
    needs: [verify]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/android.yml

  publish:
    name: GitHub release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" {p=1; next} /^## \[/{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kreate ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
