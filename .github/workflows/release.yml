name: Build binaries

# Release builds of the application for every platform, as downloadable
# artifacts. macOS has to be built on a Mac — the Apple SDK and linker are not
# something another platform can supply — so this is where a macOS build comes
# from. Run it by hand from the Actions tab, or push a tag starting with `v`.
#
# A tag is a release: the tag has to match the version in Cargo.toml, and once
# every platform is built they are published as a GitHub release with that
# version's section of CHANGELOG.md as its notes. See RELEASING.md.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && /^version *=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} does not match Cargo.toml's version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }

  build:
    name: ${{ matrix.name }}
    needs: [verify]
    # By hand there is no tag to verify, and the build still runs.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: kreate
            mcp: kreate-mcp
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: kreate
            mcp: kreate-mcp
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: kreate
            mcp: kreate-mcp
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: kreate.exe
            mcp: kreate-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Build
        run: cargo build --release -p kreate -p kreate-mcp --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/
          cp target/${{ matrix.target }}/release/${{ matrix.mcp }} dist/
          # Windows: DirectX's shader compiler beside the program, from the
          # runner's newest Windows SDK. wgpu uses it when it is there; the
          # old compiler it falls back on takes most of a minute over the
          # renderer's shaders on the first frame.
          if [ "$RUNNER_OS" = "Windows" ]; then
            sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 2>/dev/null | sort -V | tail -1)
            if [ -f "$sdk/dxcompiler.dll" ] && [ -f "$sdk/dxil.dll" ]; then
              cp "$sdk/dxcompiler.dll" "$sdk/dxil.dll" dist/
            else
              echo "::warning::no dxcompiler.dll in the Windows SDK"
            fi
          fi
          cd dist && tar czf ../kreate-${{ matrix.name }}.tar.gz *
          # The zip is what the application's updater fetches (`update::asset_name`):
          # the executables at its top level.
          for py in python3 python; do
            if "$py" -c "" 2>/dev/null; then "$py" -m zipfile -c ../kreate-${{ matrix.name }}.zip *; break; fi
          done
          test -f ../kreate-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kreate-${{ matrix.name }}
          path: |
            kreate-${{ matrix.name }}.tar.gz
            kreate-${{ matrix.name }}.zip

  publish:
    name: GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" {p=1; next} /^## \[/{p=0} p' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Kreate ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
