name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    strategy:
      fail-fast: false
      matrix:
        # The plan's portability rule: the architecture must need only compute
        # plus a single draw_indirect, which exists on all three backends. Running
        # CI on one platform is how a Windows-only renderer gets built by accident.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Arena handles carry a generation counter only when debug_assertions is
      # on, so the release build takes a genuinely different code path and a
      # different struct layout. Debug-only testing would not exercise it.
      - name: Test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p kreate-mesh -p kreate-math -p kreate-io

      # The mesh kernel is meant to stand alone and reach wasm. Checking it here
      # is what keeps that true, rather than discovering in year two that it
      # quietly grew a wgpu dependency.
      - name: Mesh kernel builds for wasm
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p kreate-mesh -p kreate-math --target wasm32-unknown-unknown

  deny:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
