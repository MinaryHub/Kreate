name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: fmt / clippy / test
    # Windows takes about an hour and a half; a test that hangs fails here
    # rather than after GitHub's six hours.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The plan's portability rule: the architecture must need only compute
        # plus a single draw_indirect, which exists on all three backends. Running
        # CI on one platform is how a Windows-only renderer gets built by accident.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The test binaries with full debug information outgrow the Linux
      # runner's disk: the linker died of it. Line tables are enough for a
      # backtrace, and the preinstalled SDKs nobody here uses go.
      - name: Room on the disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # A GPU for the renderer's tests: the runner has none, and Mesa's
      # lavapipe is a Vulkan device on the CPU that draws what a GPU draws,
      # slowly. Without it every GPU test skips itself, and a renderer change
      # that broke the picture would pass here.
      - name: Software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Every test binary, not up to the first that fails: a run that stops
      # there shows one failure where there may be five, and five runs an
      # hour apart to find them all.
      - name: Test
        if: runner.os == 'macOS'
        run: cargo test --workspace --no-fail-fast

      # The application's GPU tests crash a software device when several
      # make their devices at once — WARP on Windows, and lavapipe on Linux
      # just the same, where the composite tests died of a segmentation
      # fault the first time they ran there. One at a time; everything else
      # as usual. Bash, so a failure in the first command fails the step.
      # The renderer's own tests too: five of their binaries died the same
      # death on lavapipe, each test making its device beside the others'.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test --workspace --exclude kreate --exclude kreate-render --no-fail-fast
          cargo test -p kreate-render --no-fail-fast -- --test-threads=1
          cargo test -p kreate --no-fail-fast -- --test-threads=1

      # Windows has only WARP, and the application's tests want one at a
      # time there for the same reason.
      #
      # The renderer's own tests measure light: shadows, the path tracer,
      # the denoiser, each against a physical expectation. WARP draws none
      # of those as a GPU does — a sun's shadow comes out as acne and a
      # traced scene as nothing — and the Windows job had been red on them
      # for every run on record. They are measured on Linux's lavapipe and
      # on the Mac runner's Metal, which do; Windows still builds them
      # (clippy, above) and runs everything else.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --workspace --exclude kreate --exclude kreate-render --no-fail-fast
          # DirectX's shader compiler where the tests find it — cargo puts
          # target/debug on their PATH — as the release puts it beside the
          # program. Without it wgpu falls back on the old one, which takes
          # ten minutes over the path tracer on a real GPU and did not finish
          # in five hours on WARP.
          sdk=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 2>/dev/null | sort -V | tail -1)
          if [ -f "$sdk/dxcompiler.dll" ] && [ -f "$sdk/dxil.dll" ]; then
            mkdir -p target/debug
            cp "$sdk/dxcompiler.dll" "$sdk/dxil.dll" target/debug/
          else
            echo "::warning::no dxcompiler.dll in the Windows SDK"
          fi
          cargo test -p kreate --no-fail-fast -- --test-threads=1

      # Arena handles carry a generation counter only when debug_assertions is
      # on, so the release build takes a genuinely different code path and a
      # different struct layout. Debug-only testing would not exercise it.
      - name: Test (release)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p kreate-mesh -p kreate-math -p kreate-io

      # The mesh kernel is meant to stand alone and reach wasm. Checking it here
      # is what keeps that true, rather than discovering in year two that it
      # quietly grew a wgpu dependency.
      - name: Mesh kernel builds for wasm
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p kreate-mesh -p kreate-math -p kreate-geom2d --target wasm32-unknown-unknown

  # Feature bodies built exactly by OpenCASCADE (design/brep-kernel.md):
  # off in the release builds until every platform has the kernel, checked
  # here on Linux against the distribution's OCCT so it does not rot.
  occt:
    name: exact kernel (OCCT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: OpenCASCADE
        run: |
          sudo apt-get update
          sudo apt-get install -y libocct-modeling-algorithms-dev libocct-modeling-data-dev libocct-foundation-dev libocct-data-exchange-dev
      - name: Clippy
        run: cargo clippy -p kreate-occt -p kreate-scene -p kreate-ops --features kreate-ops/occt,kreate-occt/occt --all-targets -- -D warnings
      - name: Test
        run: cargo test -p kreate-occt -p kreate-scene -p kreate-ops --features kreate-ops/occt,kreate-occt/occt

  deny:
    name: licenses / advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  contact-relay:
    name: contact relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test
        working-directory: services/contact
        run: npm test
