[package]
name = "kreate-ops"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# For the one place an operator has something to say that is not a
# success or a failure: see `ops::object::Join`.
tracing.workspace = true
kreate-math.workspace = true
kreate-mesh.workspace = true
kreate-scene.workspace = true
# The paste operator decodes the fragment it carries. The other direction —
# io depending on ops — is what would be a cycle, and it does not exist.
kreate-io.workspace = true
kreate-ops-derive.workspace = true
kreate-reflect.workspace = true
glam.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A grouped graph is checked to compile to the shader it was.
kreate-shader.workspace = true
