[package]
name = "kreate-render"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kreate-math.workspace = true
kreate-mesh.workspace = true
glam.workspace = true
bytemuck.workspace = true
ahash.workspace = true
meshopt.workspace = true
wgpu.workspace = true
tracing.workspace = true
thiserror.workspace = true
# An environment is `Rgba16Float`, and the projection reads those bytes on the
# CPU — see `environment::irradiance_sh9` for why it is not a GPU pass.
half = "2"

[dev-dependencies]
# The compiler, for the contract test only. A *dev* dependency deliberately:
# depending on it for real would give this crate `kreate-scene` through the
# back door, and the seam §0 draws is that the renderer never sees a document.
kreate-shader.workspace = true
kreate-scene.workspace = true
pollster.workspace = true
kreate-testkit.workspace = true
# Golden images for the visual regression harness. PNG only: the goldens are
# meant to be opened in a diff by a person, and no other codec is needed to do
# that. Already in the tree via `gltf`, so this costs nothing to build.
image = { version = "0.25", default-features = false, features = ["png"] }
# Shaders are parsed and validated in unit tests, so a syntax error is a test
# failure rather than a blank window at run time.
# `msl-out` as well as `wgsl-in`: a test translates every shader to Metal
# Shading Language, which is the only way to find out whether the Metal path
# works without owning a Mac.
naga = { version = "29", features = ["wgsl-in", "msl-out", "hlsl-out", "spv-out"] }
