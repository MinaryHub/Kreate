[package]
name = "kreate-shader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kreate-math.workspace = true
kreate-scene.workspace = true

[dev-dependencies]
# The emitted text is parsed and validated in a unit test, so a generator that
# writes something WGSL does not accept fails here rather than as a blank
# material three layers away.
naga = { version = "29", features = ["wgsl-in"] }
