# cargo-deny configuration.
#
# Licensing is a product decision, not a formality: a copyleft dependency that
# reaches the shipped binary would force the whole application's licence. The
# allow-list is therefore explicit, and anything outside it fails the build
# rather than being discovered at release time.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained and there is no maintained release to move
    # to; it arrives through ab_glyph, which egui and winit's Wayland
    # decorations use, and the graphics cluster is pinned. Revisit when egui
    # moves its font parsing (skrifa is the named successor).
    { id = "RUSTSEC-2026-0192", reason = "no safe upgrade; pinned by the egui/winit cluster" },
    # paste is a finished proc macro whose author stopped maintaining it; it
    # runs only at compile time and arrives through image's EXR decoder
    # (exr -> pulp). Revisit when exr drops it.
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro only; arrives through image's exr feature" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",          # file-level copyleft only; safe to link
    "CC0-1.0",
    "BSL-1.0",          # Boost: permissive, like MIT (clipboard-win, error-code)
]
confidence-threshold = 0.9

# egui's built-in fonts are fonts, under font licences: the Open Font Licence
# and the Ubuntu Font Licence both allow bundling a font with any software.
# Granted to that crate alone, so no code under them slips in.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates refer to each other by path with no version. That is a
# wildcard to cargo-deny, and harmless for crates that are never published.
allow-wildcard-paths = true
# The graphics cluster (winit / egui / egui-wgpu / wgpu) is upgraded as a unit in
# one dedicated PR, verified by the renderer smoke test. Anything that drags in a
# second copy of wgpu has broken that.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
