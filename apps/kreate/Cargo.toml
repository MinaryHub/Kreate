[package]
name = "kreate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kreate-math.workspace = true
kreate-input.workspace = true
kreate-mesh.workspace = true
kreate-render.workspace = true
kreate-scene.workspace = true
kreate-ops.workspace = true
kreate-reflect.workspace = true
kreate-ui.workspace = true
kreate-i18n.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
kreate-io.workspace = true
kreate-shader.workspace = true
rfd.workspace = true
crash-handler.workspace = true
minidumper.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# An environment reaches the renderer as `Rgba16Float`, which is what the
# datablock holds and what a sky needs. See `environment::pixels_of`.
half = "2"

[target.'cfg(windows)'.build-dependencies]
# The icon in the executable. See `build.rs`.
winresource = "0.1"

[dev-dependencies]
# Dumps a composited frame to PNG so a layout defect can be looked at rather
# than guessed at.
image = { version = "0.25", default-features = false, features = ["png"] }
