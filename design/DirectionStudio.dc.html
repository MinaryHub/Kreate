<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ff9e29; } a:hover { color: #ffb35c; }
  </style>
</helmet>

<div style="width: 480px; height: 340px; box-sizing: border-box; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: #201e1b; font-family: Pretendard, 'IBM Plex Sans KR', system-ui, sans-serif; color: #ede8e2;">

  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">B · 스튜디오</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6e6862;">warm chrome · neutral viewport</span>
      <span style="margin-left: auto; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; color: #1b1408; background: #ff9e29; padding: 2px 6px; border-radius: 2px;">권장</span>
    </div>
    <span style="font-size: 11px; line-height: 1.45; color: #a39d95; text-wrap: pretty;">크롬만 따뜻한 중성색으로, 뷰포트는 중립으로 둡니다. 이미 쓰고 있는 주황 #FF9E29을 유일한 강조로 승격시킵니다.</span>
  </div>

  <!-- miniature -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; border: 1px solid #363230; border-radius: 3px; overflow: hidden;">
    <div style="height: 20px; display: flex; align-items: center; gap: 10px; padding: 0 8px; background: #2a2724; border-bottom: 1px solid #363230;">
      <div style="width: 24px; height: 5px; border-radius: 1px; background: #ff9e29;"></div>
      <div style="display: flex; gap: 7px;">
        <div style="width: 16px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
        <div style="width: 16px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
        <div style="width: 16px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; gap: 2px; padding: 2px; border-radius: 2px; background: #171614; border: 1px solid #363230;">
        <div style="width: 16px; height: 7px; border-radius: 1px; background: #ff9e29;"></div>
        <div style="width: 16px; height: 7px; border-radius: 1px; background: #3c3733;"></div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; min-height: 0;">
      <div style="width: 74px; display: flex; flex-direction: column; gap: 4px; padding: 7px 6px; background: #201e1b; border-right: 1px solid #363230;">
        <div style="width: 34px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
        <div style="height: 11px; border-radius: 2px; background: rgba(255,158,41,0.14); display: flex; align-items: center; padding: 0 5px; gap: 4px;">
          <div style="width: 4px; height: 4px; border-radius: 1px; background: #ff9e29;"></div>
          <div style="width: 26px; height: 4px; border-radius: 1px; background: #cdc4b8;"></div>
        </div>
        <div style="height: 11px; display: flex; align-items: center; padding: 0 5px; gap: 4px;">
          <div style="width: 4px; height: 4px; border-radius: 1px; background: #59524c;"></div>
          <div style="width: 22px; height: 4px; border-radius: 1px; background: #59524c;"></div>
        </div>
        <div style="height: 11px; display: flex; align-items: center; padding: 0 5px; gap: 4px;">
          <div style="width: 4px; height: 4px; border-radius: 1px; background: #59524c;"></div>
          <div style="width: 27px; height: 4px; border-radius: 1px; background: #59524c;"></div>
        </div>
      </div>

      <div style="flex-grow: 1; position: relative; background: #1c1c1e;">
        <svg width="100%" height="100%" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" style="display: block; position: absolute; inset: 0;">
          <g stroke="#2b2b2e" stroke-width="0.6">
            <path d="M0 96h200M0 112h200M100 84 40 150M100 84 160 150M100 84 84 150M100 84 116 150"></path>
          </g>
          <path d="M0 133h200" stroke="#9c3d44" stroke-width="0.8"></path>
          <path d="M100 84v66" stroke="#5c9440" stroke-width="0.8"></path>
          <g transform="translate(100 76)">
            <path d="M0 -30 27 -14 0 2 -27 -14z" fill="#e0d8cb"></path>
            <path d="M-27 -14 0 2v30l-27-16z" fill="#8d8c8a"></path>
            <path d="M27 -14 27 16 0 32V2z" fill="#5b5a58"></path>
            <path d="M0 -30 27 -14v30L0 32l-27-16v-30z" fill="none" stroke="#ff9e29" stroke-width="1"></path>
          </g>
        </svg>
        <div style="position: absolute; top: 6px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 5px; height: 13px; padding: 0 7px; border-radius: 2px; background: rgba(26,24,21,0.92); border: 1px solid #ff9e29;">
          <span style="font-size: 8px; font-weight: 600; color: #ff9e29;">이동</span>
          <span style="font-size: 8px; font-weight: 600; color: #d64a54;">X</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 8px;">1.400</span>
        </div>
        <svg width="30" height="30" viewBox="0 0 30 30" style="position: absolute; top: 22px; right: 6px;">
          <line x1="15" y1="15" x2="15" y2="6" stroke="#6aba54" stroke-width="1"></line>
          <line x1="15" y1="15" x2="24" y2="18" stroke="#d64a54" stroke-width="1"></line>
          <line x1="15" y1="15" x2="7" y2="20" stroke="#4a80d6" stroke-width="1"></line>
          <circle cx="15" cy="6" r="3" fill="#6aba54"></circle>
          <circle cx="24" cy="18" r="3" fill="#d64a54"></circle>
          <circle cx="7" cy="20" r="3" fill="#4a80d6"></circle>
        </svg>
      </div>

      <div style="width: 84px; display: flex; flex-direction: column; gap: 4px; padding: 7px 6px; background: #201e1b; border-left: 1px solid #363230;">
        <div style="width: 30px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #d64a54;"></div>
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #6aba54;"></div>
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #4a80d6;"></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px;">
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #d64a54;"></div>
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #6aba54;"></div>
          <div style="height: 11px; border-radius: 2px; background: #171614; border: 1px solid #363230; border-left: 2px solid #4a80d6;"></div>
        </div>
      </div>
    </div>

    <div style="height: 15px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #2a2724; border-top: 1px solid #363230;">
      <div style="width: 34px; height: 4px; border-radius: 1px; background: #a39d95;"></div>
      <div style="width: 56px; height: 4px; border-radius: 1px; background: #4a443f;"></div>
    </div>
  </div>

  <div style="display: flex; gap: 14px; font-size: 10px; line-height: 1.4;">
    <div style="flex-grow: 1;">
      <span style="color: #6e6862;">얻는 것 </span><span style="color: #bfb8b0;">이미 있는 색을 승격시키는 것이라 코드 변경이 가장 적습니다.</span>
    </div>
    <div style="flex-grow: 1;">
      <span style="color: #6e6862;">잃는 것 </span><span style="color: #bfb8b0;">따뜻한 크롬은 뷰포트 가장자리에서 색 판단을 아주 약하게 흔듭니다.</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview": {"width": 480, "height": 340}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
